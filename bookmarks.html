<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المحفوظات - القرآن الكريم</title>

    <meta name="description"
          content="الآيات التي حفظتها من القرآن الكريم للرجوع إليها لاحقاً.">

    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#234d3b">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="header-container">

            <a href="index.html" class="logo">
                القرآن الكريم
            </a>

            <nav id="main-nav">

                <a href="index.html">الرئيسية</a>

                <a href="index.html#surahs">السور</a>

                <a href="index.html#search">🔎 البحث</a>

                <a href="bookmarks.html">🔖 المحفوظات</a>

                <a href="index.html#about">حول الموقع</a>

            </nav>

            <div class="header-actions">

                <button
                    id="theme-toggle"
                    onclick="toggleTheme()"
                    aria-label="تغيير المظهر"
                >
                    🌙
                </button>

                <button
                    id="menu-button"
                    onclick="toggleMenu()"
                    aria-label="فتح القائمة"
                >
                    ☰
                </button>

            </div>

        </div>

    </header>


    <main>

        <section>

            <h1 class="page-title">🔖 الآيات المحفوظة</h1>

            <button
                id="clear-bookmarks"
                class="clear-bookmarks-btn"
                onclick="clearAllBookmarks()"
            >
                🗑️ حذف جميع المحفوظات
            </button>

            <p id="bookmarks-count" class="bookmarks-count"></p>

            <div id="bookmarks-list"></div>

        </section>

    </main>


    <footer>
        <p>القرآن الكريم</p>
    </footer>


    <!-- MINI AUDIO PLAYER -->

    <div id="audio-player" class="audio-player">

        <div class="audio-info">

            <div id="audio-title">
                لم يتم تشغيل أي آية
            </div>

            <div id="audio-status">
                القرآن الكريم
            </div>

        </div>

        <div class="audio-controls">

            <button
                id="audio-prev"
                onclick="playPreviousFromPlayer()"
                aria-label="الآية السابقة"
            >
                ⏮️
            </button>

            <button
                id="audio-main-button"
                onclick="toggleMainAudio()"
                aria-label="تشغيل وإيقاف"
            >
                ▶️
            </button>

            <button
                id="audio-next"
                onclick="playNextFromPlayer()"
                aria-label="الآية التالية"
            >
                ⏭️
            </button>

        </div>

        <div class="audio-progress-container">

            <span id="audio-current-time">0:00</span>

            <input
                type="range"
                id="audio-progress"
                min="0"
                max="100"
                value="0"
            >

            <span id="audio-duration">0:00</span>

        </div>

        <div class="audio-volume-container">

            <span>🔊</span>

            <input
                type="range"
                id="audio-volume"
                min="0"
                max="1"
                step="0.01"
                value="1"
                aria-label="مستوى الصوت"
            >

        </div>

        <button
            id="audio-close"
            onclick="closeAudioPlayer()"
            aria-label="إغلاق المشغل"
        >
            ✕
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
